resources:
  jobs:
    transitpulse_refresh:
      name: transitpulse-refresh-${bundle.target}
      description: Triggers the Lakeflow pipeline so the silver layer is at most 15 minutes behind the lake.
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      # Free Edition can starve serverless job compute for the rest of a day (docs/scale.md,
      # 2026-10-24: Python tasks pending for 45+ minutes). A run that cannot finish in 14 minutes
      # fails (failure mail) instead of blocking the next refreshes; the pipeline task alone
      # needs 3 to 4 minutes.
      timeout_seconds: 840
      tasks:
        - task_key: lakeflow
          pipeline_task:
            pipeline_id: ${resources.pipelines.transitpulse_lakeflow.id}
            full_refresh: false
        # After every refresh: row counts, freshness and expectation results as JSON in the
        # Volume (ops/health.json). Read by the runbook, the docs and later the website status.
        - task_key: health
          depends_on:
            - task_key: lakeflow
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/health_snapshot.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.bronze.name}
              - ${resources.schemas.silver.name}
              - ${resources.schemas.ops.name}
              - /Volumes/${var.catalog}/${resources.schemas.landing.name}/raw/ops/health.json
        # Forward-looking forecast log: score the trips in the feed with the champion model.
        - task_key: score
          depends_on:
            - task_key: lakeflow
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/score_delay_model.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.gold.name}
              - ${resources.schemas.silver.name}
              - ${resources.schemas.ops.name}
              - ${workspace.file_path}/src/jobs
        # Is the network unusually late right now? One row per check; a SQL alert mails on it.
        - task_key: anomaly
          depends_on:
            - task_key: lakeflow
          environment_key: default
          spark_python_task:
            python_file: ../src/jobs/detect_anomalies.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.gold.name}
              - ${resources.schemas.ops.name}
      environments:
        - environment_key: default
          spec:
            client: "2"
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - lightgbm==4.5.0
              - mlflow>=2.16
      email_notifications:
        on_failure: []

    transitpulse_train:
      name: transitpulse-train-${bundle.target}
      description: Retrain the delay-at-destination model weekly; promote only when it beats the naive baseline.
      schedule:
        quartz_cron_expression: "0 0 4 ? * SUN"
        timezone_id: Europe/Berlin
        pause_status: ${var.schedule_pause_status}
      max_concurrent_runs: 1
      tasks:
        - task_key: train
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/train_delay_model.py
            parameters:
              - ${var.catalog}
              - ${resources.schemas.gold.name}
              - ${resources.schemas.silver.name}
              - ${resources.schemas.ops.name}
              - ${workspace.file_path}/src/jobs
      environments:
        - environment_key: ml
          spec:
            client: "2"
            dependencies:
              - lightgbm==4.5.0
              - mlflow>=2.16
      email_notifications:
        on_failure: []
