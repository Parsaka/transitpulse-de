resources:
  pipelines:
    transitpulse_lakeflow:
      name: transitpulse-lakeflow-${bundle.target}
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name}
      serverless: true
      continuous: false
      photon: true
      channel: CURRENT
      configuration:
        # resources.schemas.*.name resolves to the dev-prefixed schema in development mode
        transitpulse.landing: /Volumes/${var.catalog}/${resources.schemas.landing.name}/raw/raw
        transitpulse.static: /Volumes/${var.catalog}/${resources.schemas.landing.name}/raw/static/gtfs
      libraries:
        - file:
            path: ../src/pipelines/transitpulse_pipeline.py
