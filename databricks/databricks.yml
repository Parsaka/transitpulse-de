# Databricks Asset Bundle: everything the project owns in the workspace.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
# Free Edition: serverless only, one active pipeline per type, five concurrent job tasks.
bundle:
  name: transitpulse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every schema of the project
    default: transitpulse
  schedule_pause_status:
    description: PAUSED in dev so a laptop deploy does not start a second pipeline schedule
    default: PAUSED

targets:
  # The workspace host comes from the CLI profile or DATABRICKS_HOST (never from this file).
  dev:
    mode: development
    default: true
    resources:
      pipelines:
        transitpulse_lakeflow:
          development: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schedule_pause_status: UNPAUSED
