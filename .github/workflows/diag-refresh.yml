name: Diagnose refresh job (temporary)
on:
  pull_request:
    paths: [".github/workflows/diag-refresh.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      H: ${{ vars.DATABRICKS_HOST }}
      T: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e . 2>&1 | tail -1
      - name: VBB and gtfs.de feeds right now
        run: |
          for f in vbb gtfsde; do transitpulse collect --help >/dev/null; done
          python - <<'PY'
          import urllib.request, time
          from google.transit import gtfs_realtime_pb2
          for name, url in [("vbb","https://production.gtfsrt.vbb.de/data"),("gtfsde","https://realtime.gtfs.de/realtime-free.pb")]:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "transitpulse-de diag (github.com/Parsaka/transitpulse-de)"})
                  b = urllib.request.urlopen(req, timeout=60).read()
                  m = gtfs_realtime_pb2.FeedMessage(); m.ParseFromString(b)
                  tu = [e for e in m.entity if e.HasField("trip_update")]
                  with_delay = sum(1 for e in tu for s in e.trip_update.stop_time_update if (s.HasField("arrival") and s.arrival.HasField("delay")) or (s.HasField("departure") and s.departure.HasField("delay")))
                  print(name, "bytes", len(b), "header age s", int(time.time()) - m.header.timestamp, "trip_updates", len(tu), "stop updates with delay", with_delay)
              except Exception as e:
                  print(name, "ERROR", repr(e)[:300])
          PY
      - name: Health task output of the latest refresh runs
        run: |
          api() { curl -s -m 60 -H "Authorization: Bearer $T" "$H/api/2.1/$1"; }
          for rid in $(api "jobs/runs/list?job_id=837575317072456&limit=12" | python3 -c "import json,sys;print(' '.join(str(r['run_id']) for r in json.load(sys.stdin)['runs'][::4]))"); do
            tid=$(api "jobs/runs/get?run_id=$rid" | python3 -c "import json,sys;print([t['run_id'] for t in json.load(sys.stdin)['tasks'] if t['task_key']=='health'][0])")
            echo "=== run $rid health"
            api "jobs/runs/get-output?run_id=$tid" | python3 -c "import json,sys;o=json.load(sys.stdin);print((o.get('logs') or o.get('error') or '')[:2500])"
          done
