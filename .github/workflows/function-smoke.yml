name: Function smoke test

# Runs the deployable package in the official Azure Functions Python image with Azurite and a
# fixture feed: the host must index `collect` and one execution must succeed and write Parquet.
# This is the test the cloud cannot give us: a 0-functions deployment there fails silently.

on:
  pull_request:
    paths:
      - "src/**"
      - "function_app/**"
      - "pyproject.toml"
      - "scripts/smoke_function.sh"
      - ".github/workflows/function-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke_function.sh
