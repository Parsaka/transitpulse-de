name: Polling experiment revert (one-off)

# Phase 6, change 3: the collector runs at 120 s from 2026-10-23 14:05 UTC. This one-off job puts
# the schedule back to every minute at 15:40 UTC without needing the laptop. Delete this file once
# the experiment is recorded in docs/optimisation.md (Terraform owns TP_SCHEDULE; the revert
# restores the Terraform value, so there is no drift afterwards).

on:
  schedule:
    - cron: "40 15 23 10 *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  revert:
    runs-on: ubuntu-latest
    environment: azure
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: TP_SCHEDULE back to every minute
        run: |
          az functionapp config appsettings set -n "${{ vars.FUNCTION_APP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --settings 'TP_SCHEDULE=0 * * * * *' -o none
          echo "reverted at $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
