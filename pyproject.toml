[project]
name = "transitpulse"
version = "0.1.0"
description = "Streaming lakehouse for German public-transport punctuality (GTFS-Realtime, Databricks, dbt, Azure)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Parsa Kamali"}]
dependencies = [
    "httpx>=0.27",
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
    "pyarrow>=16",
    "pandas>=2.2",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.17"]
func = ["azure-functions>=1.21"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "respx>=0.21", "pre-commit>=3.7"]

[project.scripts]
transitpulse = "transitpulse.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"databricks/src/pipelines/*.py" = ["N812", "E501", "F821"]  # Spark idioms; spark/dlt are globals
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits the network (skipped in CI)"]

[tool.mypy]
python_version = "3.11"
packages = ["transitpulse"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
