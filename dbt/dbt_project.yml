name: transitpulse
version: "1.0.0"
config-version: 2
profile: transitpulse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # DB's punctuality definition: a stop event is on time below 6 minutes of delay (5:59)
  late_threshold_s: 360
  # only stop events this far in the past count as observed (the last prediction is then final)
  settle_minutes: 20

models:
  transitpulse:
    staging:
      +materialized: view
    marts:
      +materialized: table
    ops:
      +materialized: table
      +schema: ops

seeds:
  transitpulse:
    +schema: null
    route_type_modes:
      +column_types:
        route_type: int
