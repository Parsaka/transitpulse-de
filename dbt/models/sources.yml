version: 2

sources:
  - name: silver
    description: Lakeflow pipeline output (bundle `databricks/`), refreshed every 15 minutes.
    database: workspace
    schema: tp_silver
    loader: Lakeflow Declarative Pipeline transitpulse-lakeflow-prod
    tables:
      - name: silver_stop_time_updates
        description: One row per observed change of a stop-time prediction (trip, stop, poll).
        loaded_at_field: feed_ts
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        columns:
          - name: trip_id
            tests: [not_null]
          - name: feed_ts
            tests: [not_null]
      - name: silver_stop_time_latest
        description: Latest prediction per (feed, trip, service date, stop); the current network state.
        loaded_at_field: feed_ts
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
      - name: silver_trips_gone
        description: Trips that left the realtime feed (completed or dropped).
        loaded_at_field: feed_ts
        freshness:
          warn_after: {count: 60, period: minute}
          error_after: {count: 4, period: hour}
      - name: silver_alerts
      - name: silver_weather_hourly
        description: Open-Meteo hourly weather per grid point; latest fetch per point and hour (observations replace forecasts).
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 3, period: hour}
          error_after: {count: 12, period: hour}
      - name: silver_collector_runs
        description: Collector executions in Azure, synced hourly from Log Analytics (transitpulse ops-sync).
        loaded_at_field: started_at
        freshness:
          warn_after: {count: 90, period: minute}
          # warn only: this source is fed by the two-hourly GitHub cron (ops-sync) and the next
          # pipeline update; a late cron (seen: 3 h 50 min) is not a collector incident, the Azure
          # alert covers that. A scheduled run on 2026-10-24 10:53 failed on this before the change.
        columns:
          - name: run_id
            tests: [unique, not_null]
      - name: dim_agency
      - name: dim_routes
        columns:
          - name: route_id
            tests: [unique, not_null]
      - name: dim_stops
        columns:
          - name: stop_id
            tests: [unique, not_null]
      - name: dim_trips
        columns:
          - name: trip_id
            tests: [unique, not_null]
      - name: dim_calendar
      - name: dim_calendar_dates

  - name: ops
    description: Published pipeline event log (expectation metrics, update states).
    database: workspace
    schema: tp_ops
    tables:
      - name: lakeflow_event_log
        loaded_at_field: timestamp
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
      - name: forecast_log
        description: Delay predictions for trips still in the feed, one row per trip and scoring run (score_delay_model.py).
        loaded_at_field: predicted_at
        freshness:
          warn_after: {count: 45, period: minute}
          # warn only: a stalled score task is already a job failure mail; an error here only
          # stopped the whole gold build (2026-10-27 01:28 UTC) while the pipeline was down.
      - name: network_anomalies
        description: One row per anomaly check (detect_anomalies.py); is_anomaly flags an unusually late network.
      - name: model_metrics
        description: "One row per training run (train_delay_model.py): MAE versus naive, skill, promotion."
